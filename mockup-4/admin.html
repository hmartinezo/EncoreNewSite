<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | Encore Performers</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0F172A;
      --bg-card: #1E293B;
      --bg-card-hover: #263548;
      --border: #334155;
      --text: #F1F5F9;
      --text-dim: #94A3B8;
      --text-muted: #64748B;
      --primary: #7C3AED;
      --primary-light: #A78BFA;
      --accent: #F472B6;
      --green: #34D399;
      --yellow: #FBBF24;
      --red: #F87171;
      --blue: #60A5FA;
      --radius: 12px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; min-height: 100vh;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 260px; background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 24px 0; display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 100;
    }
    .sidebar-brand {
      padding: 0 24px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .sidebar-brand h2 {
      font-size: 18px; font-weight: 700;
      background: linear-gradient(135deg, var(--primary-light), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sidebar-brand p { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .sidebar-nav { flex: 1; padding: 0 12px; }
    .sidebar-nav a {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: 8px;
      color: var(--text-dim); font-size: 13px; font-weight: 500;
      transition: all 0.2s; margin-bottom: 2px;
      text-decoration: none;
    }
    .sidebar-nav a:hover { background: rgba(124,58,237,0.1); color: var(--text); }
    .sidebar-nav a.active { background: var(--primary); color: #fff; }
    .sidebar-nav a .icon { width: 20px; text-align: center; font-size: 15px; }
    .sidebar-nav .section-label {
      font-size: 10px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 16px 16px 8px; display: block;
    }
    .sidebar-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }
    .sidebar-footer a {
      font-size: 12px; color: var(--text-muted);
      text-decoration: none; display: flex; align-items: center; gap: 8px;
    }
    .sidebar-footer a:hover { color: var(--primary-light); }

    /* --- MAIN --- */
    .main {
      margin-left: 260px; flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
    }
    .main-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px;
    }
    .main-header h1 { font-size: 24px; font-weight: 800; }
    .main-header p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .date-range {
      background: var(--bg-card); border: 1px solid var(--border);
      color: var(--text); padding: 8px 16px; border-radius: 8px;
      font-size: 13px; font-family: inherit; cursor: pointer;
    }
    .btn-refresh {
      background: var(--primary); color: #fff;
      border: none; padding: 8px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: background 0.2s;
    }
    .btn-refresh:hover { background: #6D28D9; }
    .btn-danger {
      background: transparent; color: var(--red);
      border: 1px solid var(--red); padding: 8px 16px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.2s;
    }
    .btn-danger:hover { background: var(--red); color: #fff; }

    /* --- KPI CARDS --- */
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .kpi-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 20px 24px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .kpi-card:hover { border-color: var(--primary); }
    .kpi-label {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }
    .kpi-value {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, var(--text), var(--text-dim));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .kpi-change {
      font-size: 12px; font-weight: 600; margin-top: 6px;
      display: flex; align-items: center; gap: 4px;
    }
    .kpi-change.up { color: var(--green); }
    .kpi-change.down { color: var(--red); }

    /* --- CHART CARDS --- */
    .chart-row {
      display: grid; grid-template-columns: 2fr 1fr;
      gap: 16px; margin-bottom: 16px;
    }
    .chart-row.equal { grid-template-columns: 1fr 1fr; }
    .chart-row.triple { grid-template-columns: 1fr 1fr 1fr; }
    .chart-card {
      background: var(--bg-card); border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
    }
    .chart-card h3 {
      font-size: 14px; font-weight: 700; margin-bottom: 4px;
    }
    .chart-card .subtitle {
      font-size: 11px; color: var(--text-muted); margin-bottom: 20px;
    }
    .chart-wrap { position: relative; height: 280px; }
    .chart-wrap.small { height: 220px; }

    /* --- TABLE --- */
    .data-table {
      width: 100%; border-collapse: collapse; font-size: 13px;
    }
    .data-table th {
      text-align: left; font-size: 10px; font-weight: 700;
      color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1px; padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      color: var(--text-dim);
    }
    .data-table tr:hover td { color: var(--text); background: rgba(124,58,237,0.04); }
    .data-table .bar-cell { width: 120px; }
    .mini-bar {
      height: 6px; border-radius: 3px; background: var(--border);
      overflow: hidden;
    }
    .mini-bar-fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600;
    }
    .badge-purple { background: rgba(124,58,237,0.15); color: var(--primary-light); }
    .badge-green { background: rgba(52,211,153,0.15); color: var(--green); }
    .badge-yellow { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .badge-red { background: rgba(248,113,113,0.15); color: var(--red); }

    /* --- FLOW / SANKEY-STYLE --- */
    .flow-container { padding: 12px 0; }
    .flow-row {
      display: flex; align-items: center; gap: 12px;
      padding: 8px 0; font-size: 13px;
    }
    .flow-from, .flow-to {
      padding: 6px 14px; border-radius: 8px; font-weight: 500;
      min-width: 140px; text-align: center; font-size: 12px;
    }
    .flow-from { background: rgba(124,58,237,0.15); color: var(--primary-light); }
    .flow-to { background: rgba(244,114,182,0.15); color: var(--accent); }
    .flow-arrow { color: var(--text-muted); font-size: 18px; }
    .flow-count {
      font-size: 12px; font-weight: 700; color: var(--text-dim);
      min-width: 40px; text-align: right;
    }
    .flow-bar {
      flex: 1; height: 4px; background: var(--border); border-radius: 2px;
      overflow: hidden;
    }
    .flow-bar-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 1024px) {
      .sidebar { width: 60px; padding: 16px 0; }
      .sidebar-brand h2, .sidebar-brand p, .sidebar-nav .section-label,
      .sidebar-nav a span, .sidebar-footer { display: none; }
      .sidebar-nav a { justify-content: center; padding: 12px; }
      .main { margin-left: 60px; }
      .chart-row { grid-template-columns: 1fr; }
      .chart-row.equal, .chart-row.triple { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .main { padding: 16px; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>Encore Analytics</h2>
      <p>Business Intelligence</p>
    </div>
    <nav class="sidebar-nav">
      <span class="section-label">Overview</span>
      <a href="#" class="active" data-section="overview">
        <span class="icon">📊</span><span>Dashboard</span>
      </a>
      <span class="section-label">Analysis</span>
      <a href="#" data-section="traffic">
        <span class="icon">🌐</span><span>Traffic Sources</span>
      </a>
      <a href="#" data-section="pages">
        <span class="icon">📄</span><span>Page Performance</span>
      </a>
      <a href="#" data-section="clicks">
        <span class="icon">👆</span><span>Click Analytics</span>
      </a>
      <a href="#" data-section="flow">
        <span class="icon">🔀</span><span>User Flow</span>
      </a>
      <a href="#" data-section="chatbot">
        <span class="icon">🩰</span><span>Chatbot Insights</span>
      </a>
      <span class="section-label">Reports</span>
      <a href="#" data-section="devices">
        <span class="icon">📱</span><span>Devices</span>
      </a>
      <a href="#" data-section="engagement">
        <span class="icon">⏱️</span><span>Engagement</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html">← Back to Website</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="main-header">
      <div>
        <h1 id="section-title">Dashboard Overview</h1>
        <p id="section-subtitle">Real-time website analytics and customer behavior insights</p>
      </div>
      <div class="header-actions">
        <select class="date-range" id="date-range">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
        </select>
        <button class="btn-refresh" id="refresh-btn">Refresh</button>
        <button class="btn-danger" id="clear-btn">Clear Data</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <!-- Dynamic content -->
    <div id="dashboard-content"></div>
  </div>

  <script>
    // --- DATA LAYER ---
    const LS_KEY = 'encore_analytics';

    function getStore() {
      try {
        return JSON.parse(localStorage.getItem(LS_KEY)) || { events: [], sessions: [], paths: [] };
      } catch { return { events: [], sessions: [], paths: [] }; }
    }

    function getDays() {
      return parseInt(document.getElementById('date-range').value) || 30;
    }

    function filterByDays(arr) {
      const days = getDays();
      const cutoff = Date.now() - days * 86400000;
      return arr.filter(e => e.ts >= cutoff);
    }

    function countBy(arr, key) {
      const map = {};
      arr.forEach(e => {
        const v = typeof key === 'function' ? key(e) : e[key];
        map[v] = (map[v] || 0) + 1;
      });
      return map;
    }

    function topN(obj, n) {
      return Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
    }

    function formatDuration(secs) {
      if (secs < 60) return secs + 's';
      return Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';
    }

    // Chart defaults
    Chart.defaults.color = '#94A3B8';
    Chart.defaults.borderColor = 'rgba(51,65,85,0.5)';
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.font.size = 11;
    const CHART_COLORS = ['#7C3AED', '#F472B6', '#60A5FA', '#34D399', '#FBBF24', '#F87171', '#A78BFA', '#38BDF8'];

    let charts = {};
    function destroyCharts() {
      Object.values(charts).forEach(c => c.destroy());
      charts = {};
    }

    // --- RENDER SECTIONS ---
    function renderKPIs() {
      const store = getStore();
      const events = filterByDays(store.events);
      const sessions = filterByDays(store.sessions);

      const pageviews = events.filter(e => e.type === 'pageview').length;
      const clicks = events.filter(e => e.type === 'click').length;
      const uniqueSessions = sessions.length;
      const avgDuration = sessions.length ? Math.round(sessions.reduce((s, e) => s + e.duration, 0) / sessions.length) : 0;
      const bounceRate = sessions.length ? Math.round(sessions.filter(s => s.pageCount <= 1).length / sessions.length * 100) : 0;
      const chatbotQueries = events.filter(e => e.type === 'chatbot').length;

      document.getElementById('kpi-grid').innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label">Page Views</div>
          <div class="kpi-value">${pageviews.toLocaleString()}</div>
          <div class="kpi-change up">▲ 12.5% vs prior</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Sessions</div>
          <div class="kpi-value">${uniqueSessions.toLocaleString()}</div>
          <div class="kpi-change up">▲ 8.3% vs prior</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Avg. Duration</div>
          <div class="kpi-value">${formatDuration(avgDuration)}</div>
          <div class="kpi-change up">▲ 5.1%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Bounce Rate</div>
          <div class="kpi-value">${bounceRate}%</div>
          <div class="kpi-change ${bounceRate < 40 ? 'up' : 'down'}">${bounceRate < 40 ? '▼ Good' : '▲ Needs work'}</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Total Clicks</div>
          <div class="kpi-value">${clicks.toLocaleString()}</div>
          <div class="kpi-change up">▲ 15.2%</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Chatbot Queries</div>
          <div class="kpi-value">${chatbotQueries}</div>
          <div class="kpi-change up">▲ 22.0%</div>
        </div>
      `;
    }

    // --- OVERVIEW ---
    function renderOverview() {
      const store = getStore();
      const events = filterByDays(store.events);
      const sessions = filterByDays(store.sessions);
      const content = document.getElementById('dashboard-content');

      // Daily pageviews chart data
      const pvByDate = countBy(events.filter(e => e.type === 'pageview'), 'date');
      const dates = Object.keys(pvByDate).sort();
      const pvValues = dates.map(d => pvByDate[d]);

      // Referrer distribution
      const refCounts = countBy(sessions, 'referrer');

      // Top clicked elements
      const clickEvents = events.filter(e => e.type === 'click');
      const clickCounts = countBy(clickEvents, 'label');
      const topClicks = topN(clickCounts, 8);

      content.innerHTML = `
        <div class="chart-row">
          <div class="chart-card">
            <h3>Daily Page Views</h3>
            <div class="subtitle">Visitor traffic over time</div>
            <div class="chart-wrap"><canvas id="chart-daily"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Traffic Sources</h3>
            <div class="subtitle">Where your visitors come from</div>
            <div class="chart-wrap"><canvas id="chart-sources"></canvas></div>
          </div>
        </div>
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Top Clicked Elements</h3>
            <div class="subtitle">What visitors interact with most</div>
            <table class="data-table">
              <thead><tr><th>Element</th><th>Clicks</th><th class="bar-cell">Volume</th></tr></thead>
              <tbody>
                ${topClicks.map(([label, count]) => {
                  const maxCount = topClicks[0][1];
                  const pct = Math.round(count / maxCount * 100);
                  return `<tr><td>${label}</td><td><strong>${count}</strong></td><td class="bar-cell"><div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div></td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
          <div class="chart-card">
            <h3>Exit Pages</h3>
            <div class="subtitle">Where visitors leave your site</div>
            <div class="chart-wrap small"><canvas id="chart-exit"></canvas></div>
          </div>
        </div>
      `;

      // Daily pageview chart
      charts.daily = new Chart(document.getElementById('chart-daily'), {
        type: 'line',
        data: {
          labels: dates.map(d => d.slice(5)),
          datasets: [{
            label: 'Page Views',
            data: pvValues,
            borderColor: '#7C3AED',
            backgroundColor: 'rgba(124,58,237,0.08)',
            fill: true, tension: 0.4,
            pointBackgroundColor: '#7C3AED', pointRadius: 2, pointHoverRadius: 5
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });

      // Sources donut
      charts.sources = new Chart(document.getElementById('chart-sources'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(refCounts),
          datasets: [{ data: Object.values(refCounts), backgroundColor: CHART_COLORS, borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true, pointStyle: 'circle' } } } }
      });

      // Exit pages
      const exitCounts = countBy(sessions, 'exitPage');
      charts.exit = new Chart(document.getElementById('chart-exit'), {
        type: 'bar',
        data: {
          labels: Object.keys(exitCounts),
          datasets: [{ data: Object.values(exitCounts), backgroundColor: CHART_COLORS.slice(0, Object.keys(exitCounts).length), borderRadius: 6, barThickness: 28 }]
        },
        options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, y: { grid: { display: false } } } }
      });
    }

    // --- TRAFFIC ---
    function renderTraffic() {
      const store = getStore();
      const sessions = filterByDays(store.sessions);
      const refCounts = countBy(sessions, 'referrer');
      const topRefs = topN(refCounts, 10);
      const total = sessions.length;

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Traffic Source Breakdown</h3>
            <div class="subtitle">Session distribution by referrer</div>
            <div class="chart-wrap"><canvas id="chart-traffic-pie"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Source Performance</h3>
            <div class="subtitle">Avg session duration by source</div>
            <table class="data-table">
              <thead><tr><th>Source</th><th>Sessions</th><th>% Share</th><th>Avg Duration</th></tr></thead>
              <tbody>
                ${topRefs.map(([ref, count]) => {
                  const refSessions = sessions.filter(s => s.referrer === ref);
                  const avgDur = Math.round(refSessions.reduce((s, e) => s + e.duration, 0) / refSessions.length);
                  return `<tr><td><span class="badge badge-purple">${ref}</span></td><td>${count}</td><td>${Math.round(count/total*100)}%</td><td>${formatDuration(avgDur)}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      charts.trafficPie = new Chart(document.getElementById('chart-traffic-pie'), {
        type: 'polarArea',
        data: {
          labels: Object.keys(refCounts),
          datasets: [{ data: Object.values(refCounts), backgroundColor: CHART_COLORS.map(c => c + '88'), borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 12, usePointStyle: true } } }, scales: { r: { grid: { color: 'rgba(51,65,85,0.3)' }, ticks: { display: false } } } }
      });
    }

    // --- PAGES ---
    function renderPages() {
      const store = getStore();
      const events = filterByDays(store.events);
      const pvByPage = countBy(events.filter(e => e.type === 'pageview'), 'page');
      const clicksByPage = countBy(events.filter(e => e.type === 'click'), 'page');
      const pages = Object.keys(pvByPage);

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Page Views by Page</h3>
            <div class="subtitle">Which pages attract the most traffic</div>
            <div class="chart-wrap"><canvas id="chart-pages-bar"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Page Engagement Score</h3>
            <div class="subtitle">Views vs clicks per page</div>
            <div class="chart-wrap"><canvas id="chart-pages-scatter"></canvas></div>
          </div>
        </div>
        <div class="chart-card" style="margin-top:16px">
          <h3>Detailed Page Metrics</h3>
          <div class="subtitle">Complete breakdown of page performance</div>
          <table class="data-table">
            <thead><tr><th>Page</th><th>Views</th><th>Clicks</th><th>CTR</th><th class="bar-cell">Traffic</th></tr></thead>
            <tbody>
              ${pages.sort((a,b) => (pvByPage[b]||0) - (pvByPage[a]||0)).map(page => {
                const views = pvByPage[page] || 0;
                const clicks = clicksByPage[page] || 0;
                const ctr = views > 0 ? Math.round(clicks / views * 100) : 0;
                const maxViews = Math.max(...Object.values(pvByPage));
                const pct = Math.round(views / maxViews * 100);
                return `<tr><td>${page}</td><td><strong>${views}</strong></td><td>${clicks}</td><td><span class="badge ${ctr > 50 ? 'badge-green' : ctr > 30 ? 'badge-yellow' : 'badge-red'}">${ctr}%</span></td><td class="bar-cell"><div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div></td></tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      charts.pagesBar = new Chart(document.getElementById('chart-pages-bar'), {
        type: 'bar',
        data: {
          labels: pages,
          datasets: [{ label: 'Views', data: pages.map(p => pvByPage[p] || 0), backgroundColor: '#7C3AED', borderRadius: 8, barThickness: 32 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });

      charts.pagesScatter = new Chart(document.getElementById('chart-pages-scatter'), {
        type: 'bubble',
        data: {
          datasets: pages.map((p, i) => ({
            label: p,
            data: [{ x: pvByPage[p] || 0, y: clicksByPage[p] || 0, r: Math.max(6, ((clicksByPage[p]||0) / (pvByPage[p]||1)) * 40) }],
            backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + 'CC'
          }))
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true } } }, scales: { x: { title: { display: true, text: 'Page Views' }, grid: { color: 'rgba(51,65,85,0.3)' } }, y: { title: { display: true, text: 'Clicks' }, grid: { color: 'rgba(51,65,85,0.3)' } } } }
      });
    }

    // --- CLICKS ---
    function renderClicks() {
      const store = getStore();
      const events = filterByDays(store.events);
      const clickEvents = events.filter(e => e.type === 'click');
      const byLabel = countBy(clickEvents, 'label');
      const bySection = countBy(clickEvents, 'section');
      const topLabels = topN(byLabel, 15);

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Clicks by Section</h3>
            <div class="subtitle">Which sections get the most interaction</div>
            <div class="chart-wrap"><canvas id="chart-click-sections"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>All Click Targets</h3>
            <div class="subtitle">Every element visitors click on, ranked</div>
            <div style="max-height:320px;overflow-y:auto">
            <table class="data-table">
              <thead><tr><th>Element</th><th>Clicks</th><th class="bar-cell">Volume</th></tr></thead>
              <tbody>
                ${topLabels.map(([label, count]) => {
                  const maxC = topLabels[0][1];
                  const pct = Math.round(count / maxC * 100);
                  const type = label.startsWith('cta') ? 'badge-green' : label.startsWith('program') ? 'badge-purple' : label.startsWith('camp') ? 'badge-yellow' : 'badge-purple';
                  return `<tr><td><span class="badge ${type}">${label}</span></td><td><strong>${count}</strong></td><td class="bar-cell"><div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div></td></tr>`;
                }).join('')}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      `;

      charts.clickSections = new Chart(document.getElementById('chart-click-sections'), {
        type: 'radar',
        data: {
          labels: Object.keys(bySection),
          datasets: [{ label: 'Clicks', data: Object.values(bySection), backgroundColor: 'rgba(124,58,237,0.15)', borderColor: '#7C3AED', pointBackgroundColor: '#7C3AED' }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { r: { grid: { color: 'rgba(51,65,85,0.3)' }, angleLines: { color: 'rgba(51,65,85,0.3)' }, ticks: { display: false }, suggestedMin: 0 } }, plugins: { legend: { display: false } } }
      });
    }

    // --- USER FLOW ---
    function renderFlow() {
      const store = getStore();
      const paths = filterByDays(store.paths);
      const sessions = filterByDays(store.sessions);

      // Aggregate paths
      const pathMap = {};
      paths.forEach(p => {
        const key = p.from + ' → ' + p.to;
        pathMap[key] = (pathMap[key] || 0) + 1;
      });
      const topPaths = topN(pathMap, 10);
      const maxPath = topPaths.length ? topPaths[0][1] : 1;

      // Entry pages
      const entryPages = countBy(sessions.filter(s => s.pages && s.pages.length), e => e.pages[0]);
      const exitPages = countBy(sessions, 'exitPage');

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Entry Pages</h3>
            <div class="subtitle">Where visitors start their journey</div>
            <div class="chart-wrap small"><canvas id="chart-entry"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Exit Pages</h3>
            <div class="subtitle">Where visitors leave your site</div>
            <div class="chart-wrap small"><canvas id="chart-exit-flow"></canvas></div>
          </div>
        </div>
        <div class="chart-card" style="margin-top:16px">
          <h3>Navigation Paths</h3>
          <div class="subtitle">Most common visitor journeys between pages</div>
          <div class="flow-container">
            ${topPaths.map(([path, count]) => {
              const [from, to] = path.split(' → ');
              const pct = Math.round(count / maxPath * 100);
              return `
                <div class="flow-row">
                  <span class="flow-from">${from.replace(' - ', '<br>')}</span>
                  <span class="flow-arrow">→</span>
                  <div class="flow-bar"><div class="flow-bar-fill" style="width:${pct}%"></div></div>
                  <span class="flow-to">${to.replace(' - ', '<br>')}</span>
                  <span class="flow-count">${count}</span>
                </div>`;
            }).join('')}
          </div>
        </div>
      `;

      charts.entry = new Chart(document.getElementById('chart-entry'), {
        type: 'doughnut',
        data: { labels: Object.keys(entryPages), datasets: [{ data: Object.values(entryPages), backgroundColor: CHART_COLORS, borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { padding: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 10 } } } } }
      });

      charts.exitFlow = new Chart(document.getElementById('chart-exit-flow'), {
        type: 'doughnut',
        data: { labels: Object.keys(exitPages), datasets: [{ data: Object.values(exitPages), backgroundColor: CHART_COLORS.slice(2), borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '55%', plugins: { legend: { position: 'bottom', labels: { padding: 10, usePointStyle: true, pointStyle: 'circle', font: { size: 10 } } } } }
      });
    }

    // --- CHATBOT ---
    function renderChatbot() {
      const store = getStore();
      const events = filterByDays(store.events);
      const chatEvents = events.filter(e => e.type === 'chatbot');
      const questionTexts = chatEvents.filter(e => e.action === 'question');
      const byDate = countBy(chatEvents, 'date');
      const dates = Object.keys(byDate).sort();

      // Top questions
      const qCounts = countBy(questionTexts, 'text');
      const topQ = topN(qCounts, 10);

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Chatbot Usage Over Time</h3>
            <div class="subtitle">Daily questions asked to Tutu</div>
            <div class="chart-wrap"><canvas id="chart-chatbot-daily"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Top Questions Asked</h3>
            <div class="subtitle">What customers want to know most</div>
            <div style="max-height:320px;overflow-y:auto">
            <table class="data-table">
              <thead><tr><th>Question</th><th>Count</th><th class="bar-cell">Frequency</th></tr></thead>
              <tbody>
                ${topQ.map(([q, count]) => {
                  const maxC = topQ[0]?.[1] || 1;
                  const pct = Math.round(count / maxC * 100);
                  return `<tr><td>${q}</td><td><strong>${count}</strong></td><td class="bar-cell"><div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%"></div></div></td></tr>`;
                }).join('')}
              </tbody>
            </table>
            </div>
          </div>
        </div>
      `;

      charts.chatDaily = new Chart(document.getElementById('chart-chatbot-daily'), {
        type: 'bar',
        data: {
          labels: dates.map(d => d.slice(5)),
          datasets: [{ label: 'Questions', data: dates.map(d => byDate[d]), backgroundColor: '#F472B6', borderRadius: 4, barThickness: 14 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });
    }

    // --- DEVICES ---
    function renderDevices() {
      const store = getStore();
      const sessions = filterByDays(store.sessions);
      const byDevice = countBy(sessions, 'device');

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Device Distribution</h3>
            <div class="subtitle">Desktop vs mobile vs tablet</div>
            <div class="chart-wrap"><canvas id="chart-devices"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Device Metrics</h3>
            <div class="subtitle">Session quality by device type</div>
            <table class="data-table">
              <thead><tr><th>Device</th><th>Sessions</th><th>Avg Duration</th><th>Bounce Rate</th><th>Avg Pages</th></tr></thead>
              <tbody>
                ${Object.entries(byDevice).map(([device, count]) => {
                  const devSessions = sessions.filter(s => s.device === device);
                  const avgDur = Math.round(devSessions.reduce((s, e) => s + e.duration, 0) / devSessions.length);
                  const bounce = Math.round(devSessions.filter(s => s.pageCount <= 1).length / devSessions.length * 100);
                  const avgPages = (devSessions.reduce((s, e) => s + e.pageCount, 0) / devSessions.length).toFixed(1);
                  const emoji = device === 'desktop' ? '🖥️' : device === 'mobile' ? '📱' : '📋';
                  return `<tr><td>${emoji} ${device}</td><td><strong>${count}</strong></td><td>${formatDuration(avgDur)}</td><td><span class="badge ${bounce < 40 ? 'badge-green' : 'badge-yellow'}">${bounce}%</span></td><td>${avgPages}</td></tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      charts.devices = new Chart(document.getElementById('chart-devices'), {
        type: 'doughnut',
        data: { labels: Object.keys(byDevice).map(d => d.charAt(0).toUpperCase() + d.slice(1)), datasets: [{ data: Object.values(byDevice), backgroundColor: ['#7C3AED', '#F472B6', '#60A5FA'], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: '65%', plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle', font: { size: 12 } } } } }
      });
    }

    // --- ENGAGEMENT ---
    function renderEngagement() {
      const store = getStore();
      const events = filterByDays(store.events);
      const sessions = filterByDays(store.sessions);

      // Scroll depth distribution
      const scrollEvents = events.filter(e => e.type === 'scroll');
      const depthCounts = countBy(scrollEvents, 'depth');

      // Section visibility (from scroll tracking sections)
      const sectionViews = countBy(events.filter(e => e.type === 'pageview' || e.type === 'click'), 'section');

      // Session duration distribution
      const durBuckets = { '0-15s': 0, '15-30s': 0, '30-60s': 0, '1-2m': 0, '2-5m': 0, '5m+': 0 };
      sessions.forEach(s => {
        if (s.duration < 15) durBuckets['0-15s']++;
        else if (s.duration < 30) durBuckets['15-30s']++;
        else if (s.duration < 60) durBuckets['30-60s']++;
        else if (s.duration < 120) durBuckets['1-2m']++;
        else if (s.duration < 300) durBuckets['2-5m']++;
        else durBuckets['5m+']++;
      });

      const content = document.getElementById('dashboard-content');
      content.innerHTML = `
        <div class="chart-row equal">
          <div class="chart-card">
            <h3>Scroll Depth</h3>
            <div class="subtitle">How far down the page visitors scroll</div>
            <div class="chart-wrap"><canvas id="chart-scroll"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Session Duration Distribution</h3>
            <div class="subtitle">How long visitors stay on your site</div>
            <div class="chart-wrap"><canvas id="chart-duration"></canvas></div>
          </div>
        </div>
        <div class="chart-card" style="margin-top:16px">
          <h3>Section Engagement</h3>
          <div class="subtitle">Interactions by site section</div>
          <div class="chart-wrap"><canvas id="chart-section-engagement"></canvas></div>
        </div>
      `;

      charts.scroll = new Chart(document.getElementById('chart-scroll'), {
        type: 'bar',
        data: {
          labels: ['25%', '50%', '75%', '100%'],
          datasets: [{
            label: 'Users reaching depth',
            data: [depthCounts[25]||0, depthCounts[50]||0, depthCounts[75]||0, depthCounts[100]||0],
            backgroundColor: ['#A78BFA', '#7C3AED', '#6D28D9', '#5B21B6'],
            borderRadius: 8, barThickness: 40
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });

      charts.duration = new Chart(document.getElementById('chart-duration'), {
        type: 'bar',
        data: {
          labels: Object.keys(durBuckets),
          datasets: [{ data: Object.values(durBuckets), backgroundColor: CHART_COLORS, borderRadius: 6, barThickness: 28 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });

      charts.sectionEng = new Chart(document.getElementById('chart-section-engagement'), {
        type: 'bar',
        data: {
          labels: Object.keys(sectionViews),
          datasets: [{ label: 'Interactions', data: Object.values(sectionViews), backgroundColor: '#7C3AED88', borderColor: '#7C3AED', borderWidth: 1, borderRadius: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(51,65,85,0.3)' } }, x: { grid: { display: false } } } }
      });
    }

    // --- NAVIGATION ---
    const SECTIONS = {
      overview: { title: 'Dashboard Overview', subtitle: 'Real-time website analytics and customer behavior insights', render: renderOverview },
      traffic: { title: 'Traffic Sources', subtitle: 'Understand where your visitors are coming from', render: renderTraffic },
      pages: { title: 'Page Performance', subtitle: 'Which pages attract and engage visitors most', render: renderPages },
      clicks: { title: 'Click Analytics', subtitle: 'What visitors interact with on your site', render: renderClicks },
      flow: { title: 'User Flow', subtitle: 'Navigation paths, entry points, and exit pages', render: renderFlow },
      chatbot: { title: 'Chatbot Insights', subtitle: 'Tutu chatbot usage and common questions', render: renderChatbot },
      devices: { title: 'Device Analytics', subtitle: 'Desktop, mobile, and tablet visitor breakdown', render: renderDevices },
      engagement: { title: 'Engagement Metrics', subtitle: 'Scroll depth, session duration, and section engagement', render: renderEngagement }
    };

    function navigate(sectionId) {
      destroyCharts();
      const section = SECTIONS[sectionId] || SECTIONS.overview;
      document.getElementById('section-title').textContent = section.title;
      document.getElementById('section-subtitle').textContent = section.subtitle;

      // Update sidebar active
      document.querySelectorAll('.sidebar-nav a').forEach(a => {
        a.classList.toggle('active', a.dataset.section === sectionId);
      });

      renderKPIs();
      section.render();
    }

    // Sidebar clicks
    document.querySelectorAll('.sidebar-nav a').forEach(a => {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        navigate(this.dataset.section);
      });
    });

    // Date range change
    document.getElementById('date-range').addEventListener('change', () => navigate(getCurrentSection()));
    document.getElementById('refresh-btn').addEventListener('click', () => navigate(getCurrentSection()));
    document.getElementById('clear-btn').addEventListener('click', function () {
      if (confirm('Clear all analytics data? This cannot be undone.')) {
        localStorage.removeItem('encore_analytics');
        navigate(getCurrentSection());
      }
    });

    function getCurrentSection() {
      const active = document.querySelector('.sidebar-nav a.active');
      return active ? active.dataset.section : 'overview';
    }

    // Initial render
    navigate('overview');
  </script>
</body>
</html>
